<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Freins à l’estimation du remplissage</title>
<style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}
h2{font-size:16px;margin:9px 0 5px}p{font-size:12px;line-height:1.4;margin:0 0 9px;color:var(--muted-foreground)}
section{margin:0 0 10px}header{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
strong{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:15px;display:flex;overflow:hidden;border-radius:5px;background:var(--secondary)}
.segment{display:block;height:100%;border-right:1px solid var(--background)}
.legend{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11px;margin:4px 0 9px}
.key{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
</style></head><body><h2>Remplissage sur 45 vues colorées réservées</h2><section><header>Pipeline actuel<strong>20 / 45</strong></header><div class="bar" aria-label="Estimation produite 20 · Capacité non établie 18 · Graduations insuffisantes 1 · Piston ou liquide ambigu 6"><span class="segment" style="width:44.44444%;background:var(--chart-1)" title="Estimation produite · 20"></span><span class="segment" style="width:40.00000%;background:var(--chart-2)" title="Capacité non établie · 18"></span><span class="segment" style="width:2.22222%;background:var(--chart-3)" title="Graduations insuffisantes · 1"></span><span class="segment" style="width:13.33333%;background:var(--chart-4)" title="Piston ou liquide ambigu · 6"></span></div></section><section><header>Simulation avec capacité nominale fournie<strong>25 / 45</strong></header><div class="bar" aria-label="Estimation produite 25 · Graduations insuffisantes 11 · Piston ou liquide ambigu 9"><span class="segment" style="width:55.55556%;background:var(--chart-1)" title="Estimation produite · 25"></span><span class="segment" style="width:24.44444%;background:var(--chart-3)" title="Graduations insuffisantes · 11"></span><span class="segment" style="width:20.00000%;background:var(--chart-4)" title="Piston ou liquide ambigu · 9"></span></div></section><div class="legend"><span><i class="key" style="background:var(--chart-1)"></i>Estimation produite</span><span><i class="key" style="background:var(--chart-2)"></i>Capacité non établie</span><span><i class="key" style="background:var(--chart-3)"></i>Graduations insuffisantes</span><span><i class="key" style="background:var(--chart-4)"></i>Piston ou liquide ambigu</span></div><p>La simulation fournit au pipeline la capacité attendue pour les vues bloquées à cette étape.</p></body></html>
