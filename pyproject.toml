[project]
name = "medsyringe-vision"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
    "transformers==4.57.3",
    "pillow==12.2.0",
    "pillow-heif==1.3.0",
    "opencv-python-headless==4.13.0.92",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "python-multipart==0.0.22",
]
[dependency-groups]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
